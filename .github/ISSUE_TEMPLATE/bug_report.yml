name: Bug report
description: Report a reproducible chart problem without private data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include Secret values, hashes, tokens, kubeconfigs, private addresses, financial records, or raw browser traces. Follow the [security policy](https://github.com/BHSDuncan/wealthfolio-helm/security/policy) for sensitive findings."
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Include the chart and application versions, image digest, Helm and Kubernetes versions, cluster distribution, architecture, storage driver and ingress class. Redact private details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected result
      description: Explain how to reproduce the problem with synthetic data, what you expected, and what happened. Include only nonsecret configuration and sanitized events.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and evidence
      description: List checks you ran, their results and any sanitized diagnostics. Do not include credentials or Secret contents.
