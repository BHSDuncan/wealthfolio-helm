# Optional logging and metal-price provider configuration.
# Create the provider Secret separately; never put the API key in these values.
auth:
  existingSecret: wealthfolio-auth
extraEnv:
  - name: RUST_LOG
    value: warn
  - name: METAL_PRICE_API_KEY
    valueFrom:
      secretKeyRef:
        name: wealthfolio-provider
        key: metal-price-api-key
        optional: false
