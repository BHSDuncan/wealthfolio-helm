# Use your existing ingress controller's default HTTPS certificate.
# Replace the hostname and className; verify certificate coverage and browser trust.
auth:
  existingSecret: wealthfolio-auth
  cookieSecure: "true"
app:
  corsAllowOrigins:
    - https://wealthfolio.example.test
ingress:
  enabled: true
  className: traefik
  hosts:
    - wealthfolio.example.test
  tls:
    - hosts:
        - wealthfolio.example.test
