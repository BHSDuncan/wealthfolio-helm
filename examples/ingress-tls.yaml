# Replace the example hostname, ingress class and TLS Secret name.
# The existing namespace-local Secret must cover the hostname and be browser-trusted.
auth:
  existingSecret: wealthfolio-auth
  cookieSecure: "true"
app:
  corsAllowOrigins:
    - https://wealthfolio.example.test
ingress:
  enabled: true
  className: traefik
  hosts:
    - wealthfolio.example.test
  tls:
    - secretName: wealthfolio-tls
      hosts:
        - wealthfolio.example.test
