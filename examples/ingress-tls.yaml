# Replace the reserved example hostname and existing TLS Secret for your private route.
# Replace className with your existing ingress class; this is an explicit example choice.
auth:
  existingSecret: wealthfolio-auth
  cookieSecure: "true"
app:
  corsAllowOrigins:
    - https://wealthfolio.example.test
ingress:
  enabled: true
  className: traefik
  hosts:
    - wealthfolio.example.test
  tls:
    - secretName: wealthfolio-tls
      hosts:
        - wealthfolio.example.test
