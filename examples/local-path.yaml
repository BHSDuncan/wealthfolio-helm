# Verify cluster support, local-path availability, capacity and UID/GID 1000 write access.
# local-path is node-local; it does not protect against host loss.
auth:
  existingSecret: wealthfolio-auth
persistence:
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
# Default localhost origins suit a LAN SSH tunnel to a loopback port-forward.
