# Unofficial community chart. See README.md for configuration and Secret requirements.
# Supply Secret references here; keep credential contents out of Helm values.
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
image:
  # Official upstream application image, pinned to its multiarchitecture index.
  repository: ghcr.io/wealthfolio/wealthfolio
  tag: "3.11.0"
  digest: sha256:3e996e9b3fbf9c945eca89e7b89eb03e0966beb1c51b977ccccb811f76ae2994
  pullPolicy: IfNotPresent
imagePullSecrets: []
auth:
  # Required: an existing Secret in the release namespace with both keys below.
  existingSecret: ""
  secretKeys:
    secretKey: WF_SECRET_KEY
    passwordHash: WF_AUTH_PASSWORD_HASH
  tokenTtlMinutes: 60
  cookieSecure: "auto"
app:
  # IPv4 wildcard by default; use "::" for IPv6-capable Pod networking.
  listenAddress: "0.0.0.0"
  corsAllowOrigins:
    - http://localhost:8088
    - http://127.0.0.1:8088
  requestTimeoutMs: 300000
  logFormat: text
# False means databases are plaintext; credential vault encryption still requires the stable master key.
encryption:
  required: false
persistence:
  # The complete /data directory is persistent. Chart-created claims survive uninstall.
  # Set existingClaim to use a prepared claim instead of creating one.
  existingClaim: ""
  size: 5Gi
  storageClass: null
  accessModes:
    - ReadWriteOnce
  annotations: {}
service:
  type: ClusterIP
  port: 8088
  nodePort: null
  annotations: {}
ingress:
  # Optional. Manage the ingress controller, DNS and certificates separately.
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
mcp:
  enabled: false
  auditEnabled: true
  allowedHosts: []
resources:
  # Starting values; adjust after measuring your workload.
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
podSecurityContext:
  # The chart supports this non-root identity; storage must be writable by UID/GID 1000.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
tmp:
  sizeLimit: 64Mi
probes:
  # Health probes do not verify login, data integrity or recovery.
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 30
    timeoutSeconds: 2
    failureThreshold: 3
terminationGracePeriodSeconds: 30
commonLabels: {}
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Only literal RUST_LOG and Secret-backed METAL_PRICE_API_KEY entries are supported.
extraEnv: []
tests:
  enabled: true
  image:
    repository: docker.io/curlimages/curl
    tag: "8.23.0"
    digest: sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
